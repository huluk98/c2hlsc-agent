[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2hlsc-agent"
version = "0.1.0"
description = "Conservative local agent for converting C top functions to Vitis HLS C/C++ projects with equivalence checks."
requires-python = ">=3.9"
authors = [{ name = "Local Codex" }]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
llm = ["anthropic>=0.40"]
# Closure extraction (c2hlsc_agent.closure) needs a real C frontend. Without it the
# converter still runs, but the generated translation unit carries no file-scope context
# and records that it could not.
closure = ["libclang>=16"]

[project.scripts]
c2hlsc-agent = "c2hlsc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
