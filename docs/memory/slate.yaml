# Memory slate: the settled record for this project.
#
# This file is the authority when the prose docs disagree with each other or with
# the code. Prose describes intent; entries here describe what was decided and what
# was measured, each pinned to a commit and to something that can be re-run.
#
# Three kinds of entry:
#   decisions  - a question that was put to a human and answered. Only a human
#                closes one of these.
#   evidence   - a claim about the system that was actually verified, with the
#                means to verify it again. `scripts/replay_slate.py` re-runs these.
#   frontier   - questions still open. An empty frontier means the design tree has
#                been walked; it is rarely empty for long.
#
# Adding an entry: append, never rewrite. A decision that gets reversed becomes a
# new decision that supersedes the old one by id, so the path stays legible.

version: 1

decisions:
  - id: D001
    question: >-
      How should this repository be positioned relative to arXiv 2606.28409,
      which uses the same four-stage verifier-closed ladder and reports 87.85%
      all-pass on 107 designs?
    answer: >-
      The paper is a labmate's work carrying this user's name. Positioning is
      therefore disclosure, not differentiation: cite it prominently and frame
      this repository as the group's open artifact rather than as a novel
      contribution.
    decided_by: human
    decided_on: 2026-08-27
    supersedes: null
    forecloses: >-
      Presenting the four-stage ladder, PMLC localization, or the repair-card RAG
      as new contributions of this repository.

  - id: D002
    question: >-
      Should the correctness defects in the equivalence oracle be fixed before any
      evaluation work is run?
    answer: >-
      Yes. Both defects corrupt any number the agent would produce, so measuring
      first would mean measuring again.
    decided_by: human
    decided_on: 2026-08-27
    supersedes: null
    evidence: [E001, E002]

  - id: D003
    question: >-
      What becomes of the 10,003-record natural-language corpus, whose default
      testbench asserts nothing and which ships no golden C?
    answer: >-
      It is not a correctness benchmark and will not be used to support
      correctness claims. It becomes the substrate for a knowledge base.
    decided_by: human
    decided_on: 2026-08-27
    supersedes: null
    forecloses: >-
      Reporting any pass rate over this corpus as evidence of equivalence.
    opens: [Q004]

  - id: D004
    question: >-
      Should the generator's dropped-context defect be fixed, given it is the
      largest single blocker to running an existing benchmark suite unmodified?
    answer: >-
      Yes, together with the stimulus-bounds defects that make its failures
      present as segfaults rather than diagnostics.
    decided_by: human
    decided_on: 2026-08-27
    supersedes: null
    evidence: [E003, E004]

  - id: D005
    question: >-
      Should pointer direction inference learn the dereferenced-array and arrow
      write forms (Q008)?
    answer: >-
      Yes. Implemented, together with the pointer-to-array parameter parse it
      depends on.
    decided_by: human
    decided_on: 2026-08-27
    supersedes: null
    closes: [Q008]
    evidence: [E009]
    outcome: >-
      22 designs moved from a blanket static refusal to a named compile blocker.
      No design changed verdict: the fix was necessary but not sufficient, and it
      exposed Q010 as the dominant remaining lever.

  - id: D006
    question: >-
      Was Bambu, or any open-source HLS backend, ever part of this project?
    answer: >-
      No. Vitis is the only HLS backend this repository has ever had. Bambu
      appears in no file and in no commit on any branch; it was never scratched
      because it was never started.
    decided_by: human
    decided_on: 2026-08-27
    supersedes: null
    note: >-
      Recorded so the question does not recur. `git log --all -S bambu -i` returns
      nothing, as does a grep of the working tree. The C2HLSC framework this work
      is measured against targets Catapult, which may be the source of the
      recollection.

evidence:
  - id: E001
    claim: >-
      Pointer direction inference classified an output written through a local
      alias or a helper as an input, which excluded it from the equivalence
      comparison. A design that ignored its inputs and wrote a constant passed
      every test.
    verified_by: test
    test: tests/test_analyze.py::AnalyzeTests::test_output_written_through_alias_is_still_compared
    fixed_in: ffad5a6
    note: >-
      Confirmed end to end before the fix by sabotaging a converted design to
      write a constant and observing 100/100 tests still pass.

  - id: E002
    claim: >-
      final_status judged a run by diagnostics on the *input* C, so source that
      was successfully transformed and passed equivalence still reported failure.
      That is the tool's central use case.
    verified_by: test
    test: tests/test_analyze.py::AnalyzeTests::test_generated_output_is_rescanned_independently_of_the_input
    fixed_in: ffad5a6

  - id: E003
    claim: >-
      The conservative generator emitted only the top function body, so macros,
      typedefs, constant tables and helper functions defined at file scope never
      reached the generated translation unit and it failed to compile.
    verified_by: test
    test: tests/test_convert_context.py
    fixed_in: 663addd

  - id: E004
    claim: >-
      An integer scalar with no configured range was generated as a full-range
      random value. Used as a loop bound over a fixed-size array argument it ran
      off the end, and the segfault surfaced only as a make failure with no
      diagnostic.
    verified_by: test
    test: tests/test_analyze.py::AnalyzeTests::test_unranged_scalar_is_clamped_to_the_shortest_array
    fixed_in: 663addd

  - id: E005
    claim: >-
      Across the 104 usable HLS-Eval designs, 13 reached host-side golden-vs-HLS
      equivalence on the conservative (non-LLM) path with no human adaptation.
      This is the pre-fix baseline.
    verified_by: artifact
    artifact: docs/memory/artifacts/sweep-baseline-pre-fix.json
    measured_at: 663addd~2
    method: >-
      Per design, concatenate the header and implementation, macro-expand with
      gcc -E -P, derive array lengths from declared dimensions, then run
      `convert --no-llm --no-run-vitis --new-run` and record the report verdict.
    caveat: >-
      A floor, not a headline. Host-side equivalence on the conservative path
      only; the LLM path and Vitis csim/cosim are not exercised.

  - id: E006
    claim: >-
      Carrying the input's file scope and hoisting signature typedefs took the
      HLS-Eval sweep from 13/104 to 38/104 designs reaching host-side
      golden-vs-HLS equivalence on the conservative path. 25 designs gained, none
      regressed.
    verified_by: artifact
    artifact: docs/memory/artifacts/sweep-after-fixes-preprocessed.json
    measured_at: 350bfff
    baseline: docs/memory/artifacts/sweep-baseline-pre-fix.json
    method: >-
      `scripts/run_hls_eval_sweep.py`, run before and after the fixes on
      identical inputs. The original throwaway harness is kept at
      docs/memory/artifacts/sweep-harness.py as the provenance of E005; the
      committed script reproduces its numbers exactly (see E008).
    breakdown: >-
      20 of the gains are chstone designs unblocked by hoisting signature
      typedefs (float64, flag, bits64, int8, int16); 4 are machsuite designs
      unblocked by carrying helper functions and constant tables (merge, init,
      CPF, twiddles8); 1 is pp4fpga, unblocked by dropping an unresolvable array
      bound from the header declaration.
    caveat: >-
      Still a floor, and still the conservative path with no Vitis. The harness
      pre-expands macros with gcc -E -P, so this number does not measure raw
      source handling; see E007.

  - id: E007
    claim: >-
      On raw source with macros, helpers and tables left intact -- no gcc -E -P
      pre-expansion -- the same sweep reaches 24/104.
    verified_by: artifact
    artifact: docs/memory/artifacts/sweep-after-fixes-raw-source.json
    measured_at: 350bfff
    caveat: >-
      Not a like-for-like comparison with E006 and not an agent limit. The
      harness derives each `length:` by evaluating the declared array bound, which
      fails when the bound is a macro, so those designs are converted with the
      default length of 16 while their bodies still index to the macro's value.
      The header fix cleared all ten "X was not declared in this scope" failures
      here, but the designs then fail equivalence for want of a correct bound. A
      human-written config supplies that bound; the harness cannot.

  - id: E008
    claim: >-
      The committed sweep harness reproduces the serial numbers exactly when run
      concurrently, and its output is byte-identical across repeated runs.
    verified_by: artifact
    artifact: docs/memory/artifacts/sweep-parallel-preprocessed.json
    measured_at: 3d844d4
    method: >-
      `python3 scripts/run_hls_eval_sweep.py --data-root <hls_eval_data> --workers 4`,
      compared per design against the serial results in
      sweep-after-fixes-preprocessed.json and sweep-after-fixes-raw-source.json.
    result: >-
      38/104 preprocessed and 24/104 raw, matching the serial runs on all 104
      designs in both modes with zero verdict disagreements. Two consecutive
      parallel runs produced byte-identical result files.
    note: >-
      Rows are sorted by design id before writing, so completion order cannot leak
      into the artifact. That is what makes the file usable as evidence rather than
      merely as output. Wall clock fell from roughly 15 minutes to 2m05s on 4 cores.


  - id: E009
    claim: >-
      Teaching the write pattern the `(*p)[i][j]` and `p->field` forms, and fixing
      the `T (*p)[N][M]` parameter parse, moved 22 designs past static refusal
      without changing any verdict.
    verified_by: test
    test: tests/test_analyze.py::AnalyzeTests::test_write_through_dereferenced_array_pointer_is_seen
    fixed_in: PLACEHOLDER
    result: >-
      no-observable-output fell from 26 designs to 3; the sweep stayed at 38/104.
      The 22 now fail with `cannot convert 'double*' to 'double (*)[40]'`, which
      names the real blocker instead of refusing to evaluate them.
    note: >-
      The parameter parse was a second defect underneath the first: `unsigned char
      (*state)[4][4]` yielded the argument name `state)`, and that name flowed into
      the config, the report and the testbench.

  - id: E010
    claim: >-
      The deterministic repair loop changes nothing on this corpus. Enabling
      --auto-repair gained 0 designs and lost 0.
    verified_by: artifact
    artifact: docs/memory/artifacts/sweep-repair-loop.json
    measured_at: PLACEHOLDER
    method: >-
      `scripts/run_hls_eval_sweep.py --auto-repair`, compared per design against
      the same sweep without it.
    note: >-
      Not a defect in the loop. Its four mechanical repairs address missing
      includes, `restrict` in C++, missing original-source support and invalid
      interface pragmas -- none of which is why these designs fail. Real repair
      capability sits behind `_llm_repair`, which is gated on --use-llm and was
      not exercised at corpus scale.

  - id: E011
    claim: >-
      Only 5 of 66 remaining failures (8%) are attributable to generation quality.
      40 are testbench-harness limits and 20 are properties of the input.
    verified_by: artifact
    artifact: docs/memory/artifacts/sweep-q008.json
    measured_at: PLACEHOLDER
    breakdown: >-
      29 flat testbench versus an N-D parameter; 10 rejected before generation ever
      runs; 8 stimulus cannot build the parameter type; 7 references already written
      in ap_int/ap_fixed; 5 golden-vs-HLS disagreement; 3 testbench segfault; 3 C++
      templates in the reference; 1 unclassified.
    note: >-
      This reframes the headline number. The sweep is not measuring how well the
      agent writes HLS-C -- most designs never reach a point where generation
      quality could matter. It is measuring how many designs the testbench
      generator can model at all.

frontier:
  - id: Q004
    question: >-
      What is the knowledge base keyed on, and what is allowed to enter it?
    blocked_on: human
    context: >-
      agent_loop.py already names "retrieved repair cards" as a repair input and
      audit_memory_agent claims to promote audited repair successes; neither has
      any executing code behind it, and cli.py deletes the only audit file at the
      start of every run. arXiv 2606.28409 has a family-routed evidence RAG, so
      there is a design to align with rather than invent.
    recommendation: >-
      Key on failure family plus earliest failing stage, since that is the
      retrieval context the repair prompt actually holds. Admit a card only after
      the full ladder re-passes: an unverified repair in a knowledge base
      launders a guess into an authority.

  - id: Q006
    question: >-
      Does the knowledge base replace an evaluation, or precede one?
    blocked_on: human
    context: >-
      Both compete for the same weeks. A knowledge base is a mechanism and still
      needs a benchmark to show it helps. C2HLSC's repository is public with all
      ten paper benchmarks plus 720 raw LLM baseline runs, so a published
      comparison point is available without re-running their tool.
    recommendation: >-
      Precede it. Build the knowledge base, but plan the ablation now: pass rate
      with and without retrieval over the same benchmark set. That ablation is
      the paper; the mechanism alone is a feature with no evidence.

  - id: Q009
    question: >-
      What should the agent do with a top function it cannot brace-match?
    blocked_on: human
    context: >-
      Three designs (c2hlsc/des, machsuite/bfs_queue, machsuite/md_grid) crash
      `convert` with an uncaught ValueError from _find_matching_brace rather than
      producing a report. A traceback is not a diagnosis, and a crashed run leaves
      no artifact for a human to act on.
    recommendation: >-
      Catch it at the analyze boundary and emit an error-severity diagnostic
      naming the top and the offending offset, so the run fails with a report like
      every other rejection.

  - id: Q010
    question: >-
      Should the testbench generator model multi-dimensional array parameters
      rather than flattening every argument to a 1-D buffer?
    blocked_on: human
    context: >-
      29 of the 66 remaining failures are one error: the testbench declares
      `T ref_x[LEN]` and passes `T*` where the top function wants `T (*)[40]`.
      A further 8 fail because the stimulus helpers cannot build a struct or a
      typedef'd array. Together that is 37 designs behind one model choice, and it
      is now much the largest lever -- larger than the 26-design inference gap that
      D005 just closed.
    recommendation: >-
      Yes, and treat it as the next substantial piece of work rather than a fix.
      It touches declaration, initialisation, the call site and comparison in
      testgen, and it is the difference between an n of roughly 38 and an n of
      roughly 70 on this corpus.
